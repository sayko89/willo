<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 150 870 540" width="870" height="540">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0E3A40"/><stop offset="1" stop-color="#061B1F"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0B2E33"/><stop offset=".55" stop-color="#12424A"/><stop offset="1" stop-color="#00957F"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9FF3E4"/><stop offset=".55" stop-color="#2EC4A6"/><stop offset="1" stop-color="#00957F"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#2EC4A6" stop-opacity=".75"/><stop offset="1" stop-color="#2EC4A6" stop-opacity="0"/></radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B2E33"/></marker>
    <clipPath id="lower"><rect x="0" y="330" width="1200" height="400"/></clipPath>
  </defs>
  <g transform="rotate(-11 600 330)">
    <!-- orbit -->
    <ellipse cx="600" cy="330" rx="370" ry="118" fill="none" stroke="url(#orbit)" stroke-width="5"/>
    <!-- moving body + arrow along the orbit -->
    <circle cx="297" cy="262" r="11" fill="#0B2E33"/>
    <path d="M318 254 A370 118 0 0 1 440 224" fill="none" stroke="#0B2E33" stroke-width="7" stroke-linecap="round" marker-end="url(#arr)"/>
    <!-- periapsis = water drop with ripples -->
    <circle cx="902" cy="400" r="86" fill="url(#glow)"/>
    <ellipse cx="902" cy="438" rx="52" ry="12" fill="none" stroke="#2EC4A6" stroke-width="3" opacity=".55"/>
    <ellipse cx="902" cy="438" rx="80" ry="19" fill="none" stroke="#2EC4A6" stroke-width="2" opacity=".28"/>
    <g transform="rotate(11 902 400)">
      <path d="M902 340 C902 340 868 384 868 410 a34 34 0 0 0 68 0 C936 384 902 340 902 340 Z" fill="url(#drop)" stroke="#E9FFFB" stroke-width="3"/>
      <path d="M886 404 a16 16 0 0 0 9 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    </g>
  </g>
  <text x="600" y="590" text-anchor="middle" fill="#0B2E33" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="400" letter-spacing="26">PERIAPSIS</text>
  <text x="600" y="652" text-anchor="middle" fill="#00957F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="9">WATER AI HACKATHON 2026 · NABIZ</text>
</svg>
